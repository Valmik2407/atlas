<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACE Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050810'/%3E%3Cpath d='M8 23 C10 12 16 8 24 9' stroke='%2327d7f2' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='23' r='3' fill='%2335D07F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@keyframes sp{to{transform:rotate(360deg)}}
.lib .mini{width:42px;height:42px;flex:none;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.aqi{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pc i svg,.poi svg{width:12px;height:12px}
.prof{width:100%;height:118px;display:block;cursor:crosshair}
/* map objects */
.rt-case{stroke:#000;stroke-opacity:.55}
.rt{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 14px var(--c))}
.rt-alt{cursor:pointer}
.km{width:22px;height:22px;border-radius:50%;background:#0a0e16;border:2px solid var(--c,#2E8BFF);display:grid;place-items:center;font:700 10.5px "JetBrains Mono";color:#fff;box-shadow:0 0 10px rgba(0,0,0,.6)}
.startpin{width:20px;height:20px;border-radius:50%;background:var(--good);border:3px solid #04120a;box-shadow:0 0 0 2px var(--good),0 0 22px var(--good)}
.startpin.pulse{animation:pl 2s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 2px var(--good),0 0 10px var(--good)}50%{box-shadow:0 0 0 7px rgba(53,208,127,.25),0 0 26px var(--good)}}
.turnpin{padding:3px 8px;border-radius:8px;background:#0a0e16;border:1.5px solid var(--amber);font:700 10.5px "JetBrains Mono";color:var(--amber);white-space:nowrap;box-shadow:0 0 14px rgba(255,176,32,.4)}
.wp{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 12px var(--accent)}
.poi{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#0a0e16;border:1.5px solid var(--pc);color:var(--pc);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 55%,transparent)}
.poi.sm{width:16px;height:16px;border-radius:50%;border-width:2px}
.poi.sm svg{display:none}
.hover-dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 18px #fff}
.leaflet-tooltip.tt{background:rgba(10,14,22,.95);border:1px solid var(--line2);color:var(--fg);border-radius:10px;font:12.5px Inter;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px 10px}
.leaflet-tooltip.tt::before{display:none}
.heat{mix-blend-mode:screen}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
@keyframes pk{50%{box-shadow:0 0 4px rgba(183,108,255,.15)}}
.viapin{width:24px;height:24px;border-radius:50%;background:#B76CFF;border:2.5px solid #fff;color:#fff;font:700 11px/19px Inter,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 6px rgba(183,108,255,.22),0 4px 14px rgba(0,0,0,.5)}
.scout{animation:scf .5s ease-out}
@keyframes scf{from{opacity:0}}
.aqipane{filter:blur(26px) saturate(1.2);mix-blend-mode:screen}
.aqin{min-width:34px;height:20px;padding:0 6px;border-radius:10px;background:rgba(6,9,14,.82);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);color:var(--c);font:700 11px/18px "JetBrains Mono",ui-monospace,monospace;text-align:center;box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.aqh{display:flex;align-items:center;justify-content:space-between}
.aqh .x{all:unset;cursor:pointer;color:var(--mute);font-size:16px;padding:0 4px}
.aqbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 4px}
.aqbar i{flex:1}
.aqk{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.gtip{position:fixed;z-index:900;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(10,13,18,.96);border:1px solid var(--line2);color:var(--fg);border-radius:9px;font:12.5px Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px 10px;max-width:280px}
.maplibregl-ctrl-group{background:var(--glass)!important;border:1px solid var(--line)!important;border-radius:12px!important;overflow:hidden;box-shadow:none!important;backdrop-filter:blur(14px)}
.maplibregl-ctrl-group button{width:34px!important;height:34px!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-icon{filter:invert(1) brightness(.9)}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.55)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:#8a94a2!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.maplibregl-canvas{outline:none}
body.picking .maplibregl-canvas-container{cursor:crosshair}
body[data-ms=light] .gtip{background:rgba(10,13,18,.96)}
/* profile */
.prof{width:100%;height:auto;max-height:150px;display:block;cursor:crosshair;overflow:visible}
.prof .pgl{stroke:rgba(255,255,255,.06);stroke-dasharray:2 4}
.prof .pal{stroke:rgba(255,255,255,.16)}
.prof .ptk{stroke:rgba(255,255,255,.2)}
.prof .pax{fill:#8A94A2;font:10.5px "JetBrains Mono",monospace}
.prof .pun{fill:#56606D;font:600 9.5px Inter,sans-serif;letter-spacing:.08em}
.prof .pfl{fill:#D9A441;font:10px "JetBrains Mono",monospace}
.prof .phl{stroke:#fff;stroke-opacity:.55}
.prof .phd{fill:#07090C;stroke:#fff;stroke-width:2}
.prof .phr{fill:rgba(10,13,18,.95);stroke:rgba(255,255,255,.16)}
.prof .pht1{fill:#E8EDF3;font:600 11.5px "JetBrains Mono",monospace}
.prof .pht2{fill:#8A94A2;font:10.5px Inter,sans-serif}
/* route markers */
.km{font-family:"JetBrains Mono",monospace!important}
/* ===== Atlas 4 · slim rail · electric cyan · slate ===== */
:root{--a:#27d7f2;--ai:#06171b;--ag:rgba(39,215,242,.35);--ab:rgba(39,215,242,.13);--ab2:rgba(39,215,242,.32);--p:rgba(16,18,23,.92);--p2:rgba(255,255,255,.045);--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#eef1f5;--mu:#9aa3b2;--mu2:#6f7887;--ok:#35d07f;--warn:#ffb020;--bad:#ff5c5f;--good:#35d07f;--accent:#27d7f2;--fg:#eef1f5;--glass:rgba(16,18,23,.92);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--amber:#ffb020}
html,body{margin:0;height:100%;background:#2c3544;color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before,body::after{display:none!important}
#top,#left,#right,#bottom,.ptab{display:none!important}
#map{position:fixed;inset:0;background:#2c3544}
.xn{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;letter-spacing:.01em;line-height:.92}
.xl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
.xa{color:var(--a)}
button{font:inherit;color:inherit;cursor:pointer}
/* rail */
#rail{position:fixed;z-index:500;left:14px;top:14px;bottom:14px;width:384px;display:flex;flex-direction:column;background:var(--p);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:18px;box-shadow:0 14px 50px rgba(0,0,0,.4);overflow:hidden}
#rail .hd{padding:16px 18px 12px;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;font-size:23px;letter-spacing:.16em}
.logo s{width:22px;height:22px;border-radius:7px;background:var(--a);display:inline-block;box-shadow:0 0 18px var(--ag)}
.logo .sync{margin-left:auto;font:500 12px Inter;letter-spacing:0;color:var(--mu);display:flex;align-items:center;gap:6px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#5c677a;display:inline-block}.sync .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.search{position:relative;margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:11px;padding:0 12px;color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:14px Inter;height:38px}
.search:focus-within{border-color:var(--ab2)}
.sres{position:absolute;left:0;right:0;top:44px;z-index:5;background:#15181e;border:1px solid var(--ln2);border-radius:12px;max-height:340px;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.sres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:9px 12px;color:var(--tx)}
.sres button:hover{background:var(--ab)}
#L>*{flex-shrink:0}
#L{flex:1;overflow-y:auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.xsec{display:flex;flex-direction:column;gap:9px}
.xsec>.xl{display:flex;justify-content:space-between;align-items:center}
.xhr{border:0;border-top:1px solid var(--ln);margin:0}
/* today */
.xt{border-radius:14px;padding:14px 15px;background:linear-gradient(135deg,var(--ab),rgba(255,255,255,.02));border:1px solid var(--ab2)}
.xt h3{margin:5px 0 2px;font-size:18px;font-weight:700}
.xt .sub{font-size:12.5px;color:#b7bfcb}
.xt .bt{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--ab2)}
.xt .bt b{color:var(--a);font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;line-height:1}
.xt .why{font-size:12px;color:#b7bfcb;margin-top:3px}
.days{display:flex;gap:4px;margin-bottom:10px}
.days button{flex:1;padding:5px 0;border-radius:8px;border:1px solid var(--ln);background:var(--p2);font-size:10.5px;color:var(--mu);line-height:1.15}
.days button b{display:block;font-size:13px;color:var(--tx)}
.days button[aria-pressed=true]{border-color:var(--a);background:var(--ab);color:var(--tx)}
/* controls */
.xbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--ln2);background:var(--p2);font-weight:600;font-size:13.5px;color:var(--tx)}
.xbtn:hover{border-color:var(--ab2)}
.xbtn.p{background:var(--a);color:var(--ai);border:0;box-shadow:0 0 22px var(--ag);font-weight:800;letter-spacing:.04em}
.xbtn.p:hover{filter:brightness(1.08)}
.xbtn.w{width:100%}.xbtn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.xbtn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:var(--p2);border:1px solid var(--ln);font-size:12.5px;font-weight:500;color:#e2e6ec}
.chip:hover{border-color:var(--ab2)}.chip[aria-pressed=true]{border-color:var(--a);background:var(--ab);color:#fff}
.chip .x{opacity:.5;margin-left:2px}.chip .x:hover{opacity:1}
.chip.via i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#b76cff;color:#fff;font-size:10px;display:grid;place-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--p2);border:1px solid var(--ln)}
.seg button{border:0;background:none;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--ab);color:#fff;box-shadow:inset 0 0 0 1px var(--ab2)}
.startrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--p2);border:1px solid var(--ln)}
.startrow .pin{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
.startrow b{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist{display:flex;align-items:center;gap:14px}
.dist input{flex:1;accent-color:var(--a)}
.dist .v{min-width:72px;text-align:right}.dist .v b{font-size:30px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--a) var(--f,40%),rgba(255,255,255,.14) var(--f,40%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--ag);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px var(--ag)}
.where{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px dashed var(--ab2);background:none;text-align:left;color:#d8e9ee;font-size:13px}
.where:hover{background:var(--ab)}.where i{font-style:normal;color:var(--a);font-size:16px}
/* results */
.hero{padding:14px 15px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--ln)}
.hero .nm{display:flex;align-items:center;gap:8px}
.hero .nm input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:700 16px Inter;padding:2px 0;border-bottom:1px dashed transparent}
.hero .nm input:focus{border-bottom-color:var(--ab2)}
.big{display:flex;align-items:flex-end;gap:18px;margin-top:10px}
.big .xn{font-size:52px}.big .u{font-size:20px;color:var(--mu);margin-left:3px}
.big .sm .xn{font-size:34px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.tag{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:#d1d7df}
.tag.ok{background:rgba(53,208,127,.14);color:#7fe3ab}.tag.wn{background:rgba(255,176,32,.14);color:#ffc35a}.tag.bd{background:rgba(255,92,95,.14);color:#ff8b8d}
.kipr{display:flex;gap:10px;margin-top:12px;font-size:13px;line-height:1.5;color:#dde3ea}
.kipr i{flex:none;width:22px;height:22px;border-radius:7px;background:var(--a);color:var(--ai);font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:1px}
.opts{display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);cursor:pointer;text-align:left;width:100%}
.op:hover{border-color:var(--ab2)}
.op[aria-pressed=true]{border-color:var(--a);background:var(--ab)}
.op .k{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;font-size:22px;color:var(--mu);width:16px}
.op[aria-pressed=true] .k{color:var(--a)}
.op .i{flex:1;min-width:0}.op .i b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .i span{font-size:11.5px;color:var(--mu)}
.op .s{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;font-size:28px}
.op[aria-pressed=true] .s{color:var(--a)}
.edit{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.edit button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;border:1px solid var(--ln);background:var(--p2);font-size:11px;color:#d5dbe3}
.edit button b{font-size:15px;font-weight:700;color:var(--tx);line-height:1}
.edit button:hover:not(:disabled){border-color:var(--ab2)}
.edit button[aria-pressed=true]{border-color:var(--a);background:var(--ab)}
.edit button:disabled{opacity:.35;cursor:default}
.hint{font-size:11.5px;color:var(--mu2);margin:0}
.pp{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px}
.pp div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.pp div i{width:100%;border-radius:3px 3px 1px 1px;background:var(--ab2)}
.pp div.hi i{background:var(--a)}
.pp div span{font:600 9.5px "JetBrains Mono",monospace;color:var(--mu)}
.ppl{display:flex;justify-content:space-between;font:10px "JetBrains Mono",monospace;color:var(--mu2);margin-top:3px}
.ppl span{flex:1;text-align:center}
.splitrows{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:12px;margin-top:8px}
.splitrows span{color:var(--mu)}.splitrows b{font:600 12px "JetBrains Mono",monospace;text-align:right}
.profw{margin-top:2px;overflow:hidden}
.rate{display:flex;gap:6px}
.rate button{flex:1;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--p2);font-size:17px}
.rate button[aria-pressed=true]{border-color:var(--a);background:var(--ab)}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"▾";color:var(--mu);font-size:12px}
.fold[open]>summary::after{content:"▴"}
.cues{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.cue{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03);cursor:pointer}
.cue .k{font:600 11px "JetBrains Mono",monospace;color:var(--a)}
.lib{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--p2);border:1px solid var(--ln);cursor:pointer}
.lib:hover{border-color:var(--ab2)}
.lib .i{flex:1;min-width:0}.lib .i b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lib .i span{font-size:11.5px;color:var(--mu)}
.lib .del{border:0;background:none;color:var(--mu);font-size:16px}
.lib .rb{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--ab);color:var(--a)}
.mini{width:38px;height:38px;flex:none;border-radius:8px;background:rgba(0,0,0,.25)}
.mini polyline{stroke:var(--a)!important}
.inp{width:100%;box-sizing:border-box;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--ln2);background:var(--p2);color:var(--tx);font:14px Inter;outline:0}
.inp:focus{border-color:var(--a)}
.small{font-size:12px}.muted{color:var(--mu)}
.num{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800}
/* floating map tools */
#tools{position:fixed;z-index:450;top:14px;right:14px;display:flex;gap:8px;align-items:center}
.tg{display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--p);backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.tg button{border:0;background:none;padding:7px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mu)}
.tg button.on{background:var(--ab);color:#fff;box-shadow:inset 0 0 0 1px var(--ab2)}
.tg a{padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--tx);text-decoration:none}
#smart{position:fixed;z-index:460;right:14px;top:68px;width:340px;max-height:calc(100vh - 100px);overflow:auto;border-radius:16px;background:var(--p);backdrop-filter:blur(16px);border:1px solid var(--ab2);box-shadow:0 14px 50px rgba(0,0,0,.45);padding:16px}
#smart[hidden]{display:none}
.sp{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.sp:first-of-type{border-top:0}
.sp .r{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:800;font-size:26px;color:var(--a);width:22px}
.sp .i{flex:1}.sp .i b{font-size:14px}.sp .i p{margin:3px 0 0;font-size:12px;color:var(--mu)}
.sp .i .m{display:flex;gap:10px;font-size:12px;color:#cfd6df;margin-top:5px}
#status{position:fixed;z-index:600;left:calc(50% + 200px);top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:12px;background:var(--p);border:1px solid var(--ab2);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#status[hidden]{display:none}

  const n=mkRoute(c,st,rt.mode,{turn:ob?r.coords[r.coords.length-1]:null,bear:rt.bear});n.wps=wps;n.name=null;n.name=nameOf(n);if(fast){const ar=await loadArea(n.coords[0],clamp(n.dist/2.6,900,4500));analyse(n,ar);n.climb=rt.climb;return n}await finishRoute(n);return n}

function resize(delta){const rt=A.sel;if(!rt?.wps){toast("This route can't be resized. Rebuild it first.",true);return}const target=rt.dist+delta*1000;if(target<1200){toast("That's as short as it goes.",true);return}
  editRun(delta>0?"Stretching the route by 1 km…":"Trimming 1 km…",async()=>{const S=rt.wps[0],w=rt.wps;let k=target/rt.dist,lo=delta>0?1:null,hi=delta>0?null:1,best=null;
    A.snapOn=!!A.snapAr;A.snapR=140;try{for(let it=0;it<5;it++){const nw=w.map((p,i)=>i===0||(i===w.length-1&&hav(p,S)<5)?p:[S[0]+(p[0]-S[0])*k,S[1]+(p[1]-S[1])*k]);let n=null;try{n=await reroute(rt,nw,true)}catch(e){}const cost=x=>Math.abs(x.dist-target)+(x.laneM||0)*.6;
      if(n&&Math.abs(n.dist-rt.dist)>=200&&(!best||cost(n)<cost(best)))best=n;if(best&&Math.abs(best.dist-target)/target<.06&&(best.laneM||0)<=250)break;

    if(!best){toast("Couldn't change the length on these roads. Try Build with a new distance.",true);return null}await addElev(best);best.sc=score(best,target);best.disp=dispOf(best);

function avoidAt(p){const rt=A.sel;let nm="";try{const f=gl.queryRenderedFeatures(gl.project([p[1],p[0]])).find(f=>f.properties?.name&&/street|way/.test(f.layer.id));nm=f?.properties?.name||""}catch(e){}
  A.avoid.push({p,name:nm||stepNameAt(rt,nearestM(rt,p))||"that road",at:Date.now()});LS.set("avoid",A.avoid);drawAvoid();
  if(!rt?.wps)return;editRun("Rerouting around it…",async()=>{let w=rt.wps.filter((q,i)=>i===0||i===rt.wps.length-1||hav(q,p)>70);return reroute(rt,w)})}
function nearestM(rt,p){let bi=0,bd=1e12;for(let i=0;i<rt.coords.length;i++){const d=hav(rt.coords[i],p);if(d<bd){bd=d;bi=i}}return rt.cum[bi]}
function dragTo(m,p){const rt=A.sel;if(!rt?.wps)return;const ob=rt.mode==="ob";let w=rt.wps.slice(),mm=ob&&m>rt.dist/2?rt.dist-m:m;

  if(ob&&at>=w.length)at=w.length-1;w.splice(Math.max(1,Math.min(at,w.length-(ob?0:1))),0,p);editRun("Rerouting through that point…",()=>reroute(rt,w))}

function initDrag(){if(!gl||initDrag.ok)return;initDrag.ok=true;let drag=null,ghost=null,raf=0;
  const near=pt=>{const rt=A.sel;if(!rt?.wps||A.mode==="draw"||A.busy||A.editing||A.d3)return null;let best=null,bd=1e9;const step=Math.max(1,Math.floor(rt.coords.length/700));
    for(let i=0;i<rt.coords.length;i+=step){const q=gl.project([rt.coords[i][1],rt.coords[i][0]]),d=Math.hypot(q.x-pt.x,q.y-pt.y);if(d<bd){bd=d;best=i}}return bd<10?{i:best,m:rt.cum[best]}:null};
  gl.on("mousemove",e=>{if(drag){ghost?.setLngLat(e.lngLat);return}if(raf)return;raf=requestAnimationFrame(()=>{raf=0;document.body.classList.toggle("xgrab",!!near(e.point))})});
  gl.on("mousedown",e=>{if(e.originalEvent.button!==0)return;const h=near(e.point);if(!h)return;e.preventDefault();gl.dragPan.disable();drag=h;document.body.classList.add("xdrag");
    const el=document.createElement("div");el.className="ghost";ghost=new maplibregl.Marker({element:el}).setLngLat(e.lngLat).addTo(gl)});
  const end=e=>{if(!drag)return;const d=drag;drag=null;gl.dragPan.enable();document.body.classList.remove("xdrag");ghost?.remove();ghost=null;A._dragEnd=Date.now();
    const ll=e.lngLat,p=[ll.lat,ll.lng],orig=ptAt(A.sel.coords,A.sel.cum,d.m);if(hav(orig,p)<25)return;dragTo(d.m,p)};
  gl.on("mouseup",end)}

  if(prev)applyLearn(rt,prev.up,-1);A.rate[k]={up,tags:[],at:Date.now()};applyLearn(rt,up,1);LS.set("ratings",A.rate);A.options.forEach(o=>{learnFr(o);o.sc=score(o,A.km*1000);o.disp=dispOf(o)});renderLeft();toast(up?"Noted. Atlas will favour these roads.":"Noted. Atlas will steer away from these roads.")}

    const opts=mode!=="draw"&&A.options.length?`<div class="xsec"><div class="xl"><span>${A.options.length} options</span><span>score</span></div><div class="opts">${A.options.map((o,i)=>`<button class="op" data-act="opt" data-i="${i}" aria-pressed="${o===rt}"><span class="k">${o.label||"ABC"[i]}</span><span class="i"><b>${esc(o.name)}</b><span>${r1(o.dist/1000)} km · ${o.mainF2!=null?r0(o.mainF2*100)+"% main · ":""}${(o.signals||0)+(o.cross||0)} stops</span>${mixBar(o.mix,4)}</span><span class="s">${o.disp}</span></button>`).join("")}</div></div>`:"";
    right=`${opts}
    <div class="hero2"><div class="nm"><span class="num a" style="font-size:22px">${rt.label||""}</span><input id="rname" value="${esc(rt.name)}" aria-label="Route name"></div>
      <div class="big"><div><div class="xl">Distance</div><span class="xn">${r1(rt.dist/1000)}</span><span class="u xn">KM</span></div><div><div class="xl">Score</div><span class="xn a">${rt.disp??dispOf(rt)}</span></div><div class="sm"><div class="xl">Time</div><span class="xn">${fmtT(t)}</span></div><div class="sm"><div class="xl">Climb</div><span class="xn">+${rt.climb??0}m</span></div></div>
      <div class="kipr"><i>K</i><div>${esc(kipReason(rt))}</div></div></div>
    ${m?`<div class="xsec"><div class="xl"><span>Route ${rt.label||""} breakdown</span><span class="lc">${r1(rt.dist/1000)} km</span></div>${mixBar(m,10)}<div class="leg">${Object.keys(MIXC).map(k=>`<span style="--c:${MIXC[k]}">${MIXL[k]} ${r0(m[k]*100)}%</span>`).join("")}</div></div>`:""}
    <div class="xsec"><div class="xl"><span>Edit</span><span class="lc">or drag the line on the map</span></div><div class="edit">
      <button data-act="x-minus" ${!rt.wps||A.editing?"disabled":""}><b>−1</b>km</button><button data-act="x-plus" ${!rt.wps||A.editing?"disabled":""}><b>+1</b>km</button>
      <button data-act="x-avoid" aria-pressed="${!!A.avoidPick}" ${!rt.wps||A.editing?"disabled":""}><b>⊘</b>Avoid</button><button data-act="x-undo" ${A.hist.length?"":"disabled"}><b>↶</b>Undo</button><button data-act="x-redo" ${A.fut.length?"":"disabled"}><b>↷</b>Redo</button></div>
      ${A.avoidPick?`<p class="hint" style="color:var(--a)">Click the road on the map you want to avoid.</p>`:""}${A.avoid.length?`<p class="hint">${A.avoid.length} road${A.avoid.length>1?"s":""} avoided · <a href="#" data-act="x-avclear" style="color:var(--mu)">clear</a></p>`:""}</div>
    ${compareHTML()}
    <div class="xsec"><div class="xl"><span>Elevation & pace plan</span><span class="lc">${ZL[zonesOf(rt)[0].z]} ${fmtT(P[zonesOf(rt)[0].z])}/km</span></div><div class="profw" id="profw">${profSvg(rt,300)}</div>
      <div class="pp">${sp.map((x,i)=>{const h=mx===mn?60:30+70*(mx-pk[i])/(mx-mn);return`<div title="km ${x.k}: ${fmtT(pk[i])}/km${x.el?` · ${x.el>0?"+":""}${x.el} m`:""}${x.sg?` · ${x.sg} stops`:""}"><span>${fmtT(pk[i])}</span><i style="height:${h}%;${x.z!=="easy"?`background:${ZC[x.z]}`:""}"></i></div>`}).join("")}</div><div class="ppl">${sp.map(x=>`<span>${x.k}</span>`).join("")}</div></div>
    <details class="fold"><summary class="xl">Kip cues for the run</summary><div class="cues">${cues(rt).map(c=>`<div class="cue" data-act="cue" data-m="${c.m}"><span class="k">${c.m<0?"Before":"Km "+r1(c.m/1000)}</span><span>${esc(c.t)}</span></div>`).join("")}</div></details>
    <div style="display:flex;gap:6px"><button class="xbtn" style="flex:1" data-act="save">${rt.saved?"Saved ✓":"Save route"}</button><button class="xbtn p" style="flex:1.3" data-act="send">SEND TO PACE</button></div>
    <div class="xsec"><div class="xl"><span>Ran it? Rate it</span><span class="lc">teaches Atlas</span></div><div class="rate"><button data-act="x-rate" data-v="1" aria-pressed="${r?.up===true}">👍</button><button data-act="x-rate" data-v="0" aria-pressed="${r?.up===false}">👎</button></div>
      ${r?`<div class="chips">${(r.up?TAGS_UP:TAGS_DN).map(t2=>`<button class="chip" data-act="x-tag" data-t="${esc(t2)}" aria-pressed="${r.tags.includes(t2)}">${t2}</button>`).join("")}</div>`:""}</div>`}
  const lib=A.routes.length?A.routes.map(r=>{const ran=r.ran||[],pr=ran.length?Math.min(...ran.map(x=>x.secs)):null,rt2=A.rate[r.id];return`<div class="lib" data-act="open" data-id="${r.id}" role="button" tabindex="0">${miniSvg(r.poly)}<div class="i"><b>${esc(r.name)}</b><span>${r.km} km${ran.length?` · ran ${ran.length}× · PR ${fmtT(pr)}`:""}${rt2?` · ${rt2.up?"👍":"👎"}`:""}</span></div>${ran.length&&!rt2?'<span class="rb">rate</span>':""}<button class="del" data-act="del" data-id="${r.id}" title="Delete">×</button></div>`}).join(""):`<p class="hint">Saved routes land here.</p>`;
  $("#L").innerHTML=`<div class="wkrow">${weekHTML()}</div><div class="cols"><div class="col">${hero}${weekLoad()}${ctl}${buildB}${planB}${routeOfWeek()}
    <details class="fold" ${A.routes.length&&!rt?"open":""}><summary class="xl">Your routes · ${A.routes.length}</summary><div class="opts" style="margin-top:8px">${lib}</div></details></div><div class="col">${right}</div></div>`;
  const r=$("#kmR");if(r)r.oninput=e=>{A.km=+e.target.value;A.kmTouched=true;$("#kmV").textContent=A.km;r.style.setProperty("--f",(A.km-1)/29*100+"%");const b=$("[data-act=build]");if(b&&!A.busy)b.textContent=`BUILD ${A.mode==="ob"?"OUT & BACK":"LOOP"} · ${A.km} KM`};
  const n=$("#rname");if(n&&A.sel)n.onchange=e=>{A.sel.name=e.target.value.trim().slice(0,60)||A.sel.name;if(A.sel.saved)saveSel()};
  const sv=$("#prof");if(sv&&A.sel){const rt3=A.sel;sv.style.width="100%";sv.style.height="auto";sv.onmousemove=e=>{const b=sv.getBoundingClientRect(),m=clamp(((e.clientX-b.left)*(PG.W/b.width)-PG.pl)/PG.iw,0,1)*rt3.dist;profHover(m)};sv.onmouseleave=()=>profHover(null)}
  $("#runBtn")?.classList.toggle("on",!!A.runnable)}
function PADS(){const sm=!$("#smart").hidden;return{paddingTopLeft:[($("#rail")?.offsetWidth||640)+50,70],paddingBottomRight:[sm?380:60,50]}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;if(a==="x-planweek")planWeek();if(a==="x-runnable")toggleRunnable()});

/* ================= boot ================= */
readHash();initMap();applyPanels();renderAll();if(A.focus&&A.routes.some(r=>r.id===A.focus))setTimeout(()=>openSaved(A.focus),300);
if(!A.start){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,16);setStart(c,false)},()=>{setStart(MUMBAI,false);toast("Using Marine Drive. Allow location or click the map to change the start.")},{timeout:8000,maximumAge:120000});else setStart(MUMBAI,false)}
else loadWx();
renderLeft();
</script></body></html>
