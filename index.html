    const sg=(rt.pois||[]).filter(p=>p.t==="signal"&&p.m>=a&&p.m<b).length+(rt.roadX||[]).filter(p=>p.m>=a&&p.m<b).length;t=t*heat+sg*12;let el=0;if(rt.elev){const e=x=>{const i=rt.elev.findIndex(q=>q.m>=x);return(rt.elev[i<0?rt.elev.length-1:i]).e};el=e(b)-e(a)}
    o.push({k:o.length+1,len:b-a,t,z:Object.entries(dom).sort((x,y)=>y[1]-x[1])[0][0],sg,el})}return o}
function cues(rt){const P=pz(),Z=zonesOf(rt),w=hourWx(),o=[],km=m=>r1(m/1000),pain=painNow();
  if(Z.length>1){o.push({m:0,t:`Warm up easy at ${fmtT(P.easy)}/km. Don't start the work early.`});for(const z of Z.slice(1)){if(z.z!=="easy")o.push({m:z.a,t:`${ZL[z.z]} starts. Settle at ${fmtT(P[z.z])}/km, smooth not sprinting.`});else if(z.b<rt.dist-50||z.a>0)o.push({m:z.a,t:z.b>=rt.dist-5?"Work done. Cool down easy all the way home.":"Recover. Jog it out, get your breath back."})}}
  else o.push({m:0,t:`Easy the whole way, ${fmtT(P[Z[0].z])}/km. You should be able to talk.`});
  for(const b of rt.bridges||[])o.push({m:b.a,t:`Flyover (${r0(b.b-b.a)} m). Shorten stride, hold effort, let pace drop.`});
  if(rt.elev){for(let i=0;i<rt.elev.length;i++){let j=i;while(j+1<rt.elev.length&&rt.elev[j+1].m-rt.elev[i].m<500)j++;const g=rt.elev[j].e-rt.elev[i].e;if(g>=7&&!(rt.bridges||[]).some(b=>Math.abs(b.a-rt.elev[i].m)<300)&&!o.some(c=>c.cl&&Math.abs(c.m-rt.elev[i].m)<800)){o.push({m:rt.elev[i].m,cl:1,t:`Climb ahead, +${r0(g)} m. Short steps, arms drive.`})}}}
  const sig=[...(rt.pois||[]).filter(p=>p.t==="signal"),...(rt.roadX||[])].sort((a,b)=>a.m-b.m);for(let i=0;i<sig.length;i++){let j=i;while(j+1<sig.length&&sig[j+1].m-sig[i].m<900)j++;if(j-i>=2){o.push({m:sig[i].m,t:`${j-i+1} road crossings close together. Jog on the spot, don't sprint the gaps.`});i=j}}
  const wt=(rt.pois||[]).filter(p=>(p.t==="water"||p.t==="shop"||p.t==="cafe")&&p.m>1500).sort((a,b)=>a.m-b.m)[0];if(wt&&rt.dist>4500)o.push({m:wt.m,t:`Water stop option: ${wt.name||PT[wt.t][0].slice(0,-1)}.`});
  if(rt.mode==="ob")o.push({m:rt.dist/2,t:"Turnaround. Check the watch, run home even or faster."});
  o.push({m:Math.max(0,rt.dist-1000),t:"Last km. Run tall, relax the shoulders, finish strong."});
  if(w&&w.pen>=1.5)o.unshift({m:-1,t:`Heat cost +${w.pen}%: run by effort, expect ~${r0(P.easy*w.pen/100)} s/km slower. Water before you go.`});
  if(w?.aqi>150)o.unshift({m:-1,t:`AQI ${w.aqi}: keep it easy today, or move hard bits indoors.`});

  if(isDark()&&rt.litF!=null)o.unshift({m:-1,t:`After sunset: ${r0(rt.litF*100)}% of this route is on lit roads. Wear something bright.`});

/* ================= build ================= */
async function build(){if(A.busy)return;if(!A.start){toast("Set a start first: My location, a favourite, or click the map.",true);return}
  const D=A.km*1000,S=A.start;A.busy=true;A.options=[];A.sel=null;A.cmp=[];clearRoute();renderLeft();renderBottom();status("Reading the area: paths, parks, signals…");
  const areaP=loadArea(S,clamp(D/2.6,900,4500)),N=16,bears=[...Array(N)].map((_,i)=>(i*360/N+Math.random()*10-5+360)%360);
  const jobs=A.mode==="ob"?bears.map(b=>()=>obAt(S,b,D)):[...bears.map(b=>()=>loopAt(S,b,D)),...bears.filter((_,i)=>i%2).map(b=>()=>longAt(S,b,D))];
  let done=0;status(`Scouting routes… 0/${jobs.length}`);
  try{const res=(await Promise.allSettled(jobs.map(f=>f().finally(()=>{done++;status(`Scouting routes… ${done}/${jobs.length}`)})))).filter(r=>r.status==="fulfilled"&&r.value).map(r=>r.value);
    if(!res.length)throw new Error("none");status("Checking crossings, stops and scenery…");const ar=await areaP;if(!ar.ok)toast("Couldn't load cafes/signals right now. Routes still work.",true);
    const near=res.filter(r=>Math.abs(r.dist-D)/D<=.18),pool=near.length?near:res;pool.forEach(r=>analyse(r,ar));pool.forEach(r=>r.sc=score(r,D));pool.sort((a,b)=>b.sc-a.sc);
    const pick=[];for(const r of pool){if(pick.length>=20)break;if(pick.every(p=>overlap(r,p)<.55&&overlap(p,r)<.55))pick.push(r)}
    status(`Measuring climbs on ${pick.length} routes…`);await Promise.all(pick.map(addElev));pick.forEach(r=>r.sc=score(r,D));pick.sort((a,b)=>b.sc-a.sc);
    const hi=pick[0].sc,lo=pick[pick.length-1].sc,seen={};pick.forEach((r,i)=>{r.rank=i+1;r.disp=pick.length>1?r0(60+39*(r.sc-lo)/((hi-lo)||1)):99;if(seen[r.name])r.name+=` · ${dirWord(r.bear||0)}`;seen[r.name]=1});
    A.options=pick;A.sort="best";A.busy=false;status("");selectRoute(pick[0]);toast(`${pick.length} different route${pick.length>1?"s":""} found. #1 is selected.`)
  }catch(e){A.busy=false;status("");toast("Couldn't reach the route service. Check your internet and try again.",true);renderLeft()}}
async function finishRoute(rt){const ar=A.start?await loadArea(rt.coords[0],clamp(rt.dist/2.6,900,4500)):null;analyse(rt,ar);await addElev(rt);return rt}
function selectRoute(rt){A.sel=rt;drawRoute();renderAll();if(rt&&rt.coords.length>1)map.fitBounds(L.latLngBounds(rt.coords),{paddingTopLeft:[360,80],paddingBottomRight:[340,230],maxZoom:16})}

function drawRebuild(){L_draw.clearLayers();A.draw.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:L.divIcon({className:"",html:i?'<div class="wp"></div>':'<div class="startpin"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(L_draw);m.on("dragend",e=>{const l=e.target.getLatLng();A.draw[i]=[l.lat,l.lng];if(!i){A.start=A.draw[0];LS.set("start",A.start)}drawRebuild()});m.on("contextmenu",()=>{if(i){A.draw.splice(i,1);drawRebuild()}})});

function sendPace(){const hrs=[];if(A.wx){const H=A.wx.hourly,now=new Date(),k0=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")+"T"+String(now.getHours()).padStart(2,"0");

  $("#L").innerHTML=`${today}
  <div class="sec"><span class="ey">Mode</span><div class="seg">${[["loop","Auto loop"],["ob","Out & back"],["draw","Draw"]].map(([k,l])=>`<button data-act="mode" data-v="${k}" aria-pressed="${A.mode===k}">${l}</button>`).join("")}</div></div>
  <div class="sec"><span class="ey">Start</span><div class="chips"><button class="chip" data-act="locate">◎ My location</button>${favs}<button class="chip" data-act="favadd" ${A.start?"":"disabled"}>＋ Save start</button></div><p class="hint">Or click anywhere on the map${A.mode==="draw"?" (in Draw, clicks add points)":""}.</p></div>
  ${A.mode!=="draw"?`<div class="sec"><span class="ey">Distance</span><div class="dist"><input type="range" min="1" max="21" step="0.5" value="${A.km}" id="kmR" aria-label="Distance in km"><div class="val"><b class="num" id="kmV">${A.km}</b> <span class="muted">km</span></div></div></div>
  <div class="sec"><span class="ey">Prefer</span><div class="tog"><span>Promenades, parks & paths</span><button class="sw" data-act="pref" data-k="scenic" aria-pressed="${P.scenic}" aria-label="Prefer promenades"></button></div><div class="tog"><span>Fewest crossings</span><button class="sw" data-act="pref" data-k="cross" aria-pressed="${P.cross}" aria-label="Fewest crossings"></button></div><div class="tog"><span>Flat</span><button class="sw" data-act="pref" data-k="flat" aria-pressed="${P.flat}" aria-label="Flat"></button></div><div class="tog"><span>Well-lit roads</span><span class="small ${isDark()?"amb":"muted"}">${isDark()?"On (after sunset)":"Auto after sunset"}</span></div></div>
  <button class="btn p w" style="margin-top:14px;height:44px" data-act="build" ${A.busy?"disabled":""}>${A.busy?'<span class="spin"></span> Building…':"Build "+(A.mode==="ob"?"out & back":"loops")}</button>`:draw}
  ${opts?`<div class="sec"><span class="ey">${A.options.length} routes · tap ⇄ on two to compare</span>${sortBar}${opts}</div>`:""}
  ${A.sel?`<div class="sec"><span class="ey">Save</span><div style="display:flex;gap:6px"><input class="inp" id="rname" value="${esc(A.sel.name)}" aria-label="Route name"><button class="btn" data-act="save">${A.sel.saved?"Update":"Save"}</button></div></div>`:""}
  <div class="sec"><span class="ey">Your routes · ${A.routes.length}</span>${lib}</div>`;
  const r=$("#kmR");if(r)r.oninput=e=>{A.km=+e.target.value;A.kmTouched=true;$("#kmV").textContent=A.km}}
function renderRight(){const el=$("#right");if(!A.wx){el.innerHTML=`<div class="wxhead"><span class="ey">The day</span><p class="muted small" style="margin:10px 0 16px">${A.start?"Loading the forecast…":"Set a start to see the weather there."}</p></div>${poiPanel()}`;return}
  const w=hourWx(),S=sunTimes(),b=bestSlot(),dk=dayKey(A.day),dd=new Date(dk+"T12:00"),rt=A.sel;
  const hs=[];for(let h=4;h<=22;h++){const x=hourWx(A.day,h);if(!x)continue;const ht=clamp((x.t-18)/18,.12,1)*100;hs.push(`<button style="height:${ht}%;background:${penCol(x.pen)};color:${penCol(x.pen)}" class="${b&&b.h===h?"best":""}" aria-pressed="${A.hour===h}" data-act="hour" data-h="${h}" title="${hLbl(h)} · ${r0(x.t)}° · heat +${x.pen}%${x.aqi!=null?" · AQI "+x.aqi:""}"></button>`)}
  const wn=rt?windNote(rt):"";
  el.innerHTML=`<div class="wxhead"><span class="ey">${DN[dd.getDay()]} ${dd.getDate()} ${MN[dd.getMonth()]} · ${hLbl(A.hour)}</span>
    <div class="daypick">${[0,1,2].map(i=>{const k=dayKey(i);if(!k)return"";const d=new Date(k+"T12:00");return`<button data-act="day" data-d="${i}" aria-pressed="${A.day===i}">${i===0?"Today":i===1?"Tomorrow":DN[d.getDay()]}</button>`}).join("")}</div>
    ${w?`<div class="wxbig"><b class="num">${r0(w.t)}°</b><span class="muted">feels ${r0(w.feels)}° · ${w.rh}%</span></div>`:""}</div>
  <div class="hours" role="group" aria-label="Pick a start hour">${hs.join("")}</div><div class="hlab"><span>4 am</span><span>noon</span><span>10 pm</span></div>
  <div class="pad">${w?`<div class="row"><span>Heat cost</span><b style="color:${penCol(w.pen)}">${w.pen?"+"+w.pen+"% slower":"None"}</b></div>
    <div class="row"><span>Air (AQI)</span><b><i class="aqi" style="background:${aqiCol(w.aqi)};box-shadow:0 0 8px ${aqiCol(w.aqi)}"></i>${w.aqi??"–"} <span class="muted" style="font-weight:500">${aqiLbl(w.aqi)}</span></b></div>
    <div class="row"><span>Rain</span><b>${w.rain}%</b></div>
    <div class="row"><span>Wind</span><b><span class="wind" style="transform:rotate(${(w.wd+180)%360}deg)">↑</span> ${r0(w.ws)} km/h${wn?` <span class="muted" style="font-weight:500">· ${esc(wn)}</span>`:""}</b></div>
    ${w.uv>3?`<div class="row"><span>UV</span><b class="${w.uv>6?"bad":"amb"}">${r1(w.uv)}</b></div>`:""}`:""}
    ${S?`<div class="row"><span>Sunrise · sunset</span><b>${S.riseS} · ${S.setS}</b></div>`:""}
    <div class="row"><span>Best start</span>${b?`<button class="btn sm" data-act="hour" data-h="${b.h}" style="color:var(--good);border-color:rgba(53,208,127,.4)">${hLbl(b.h)}</button>`:"<b class='muted'>–</b>"}</div>
    <div class="row"><span>Light</span><b class="${isDark()?"amb":""}">${isDark()?"Dark · lit roads preferred":"Daylight"}</b></div>
  </div>${poiPanel()}`}
function poiPanel(){const rt=A.sel,c=t=>rt?(rt.pois||[]).filter(p=>p.t===t).length:"–";
  return`<div class="pad" style="border-top:1px solid var(--line);padding-top:14px"><span class="ey" style="display:block;margin-bottom:8px">On route · within 50 m</span><div class="poichips">${Object.entries(PT).map(([k,[l,col]])=>`<button class="pc" data-act="poi" data-k="${k}" aria-pressed="${!!A.poiOn[k]}"><i style="background:color-mix(in srgb,${col} 18%,transparent);color:${col}">${ICON[k]}</i>${l}<b>${c(k)}</b></button>`).join("")}</div>
  ${rt&&rt.areaOk===false?`<p class="hint">Couldn't load stops from OpenStreetMap this time.</p>`:""}</div>`}
function renderBottom(){const el=$("#bottom"),rt=A.sel;if(A.cmp.length===2&&renderCompare(el))return;
  if(!rt){el.innerHTML=`<div class="empty">${A.busy?'<span class="spin"></span><span>Building your routes…</span>':`<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M6 32c4-16 12-22 28-22" stroke="#2E8BFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 6"/><circle cx="6" cy="32" r="4" fill="#35D07F"/></svg><div><b style="color:var(--fg)">No route yet</b><br><span class="small">${A.mode==="draw"?"Click the map to start drawing.":"Pick a start and a distance, then Build. Or open one of your routes."}</span></div>`}</div>`;return}
  const d=difficulty(rt),t=estTime(rt),s=sess();
  el.innerHTML=`<div class="bgrid"><div><input class="rname" value="${esc(rt.name)}" aria-label="Route name" id="rname2"><div class="bstats"><div class="big"><b class="num">${r1(rt.dist/1000)}</b><span class="muted">km</span><span class="badge" style="margin-left:auto;color:${d.col};background:color-mix(in srgb,${d.col} 14%,transparent)" title="${esc(d.parts.map(p=>p[0]+": "+r0(p[1])).join("\n"))}">${d.lbl} · ${d.s}</span></div>
    <div><span class="ey">Est. time</span><b class="num">${fmtT(t)}</b></div><div><span class="ey">Climb</span><b class="num">${rt.climb??0} m</b></div><div><span class="ey">Signals</span><b class="num">${rt.signals??"–"}</b></div><div><span class="ey">Crossings</span><b class="num">${rt.cross??"–"}</b></div></div></div>
  <div><div class="tabs">${[["profile","Profile"],["splits","Splits"],["kip","Kip cues"]].map(([k,l])=>`<button data-act="tab" data-v="${k}" aria-pressed="${A.tab===k}">${l}</button>`).join("")}<span class="sp"></span><span class="tlab">${esc(typeLabel())} · ${dayWord()}</span></div>
  ${A.tab==="profile"?profSvg(rt):A.tab==="splits"?`<div class="splits">${splits(rt).map(x=>`<div class="split" style="--zc:${ZC[x.z]}"><span>KM ${x.k}${x.len<990?" ("+r1(x.len/1000)+")":""}</span><b class="num">${fmtT(x.t)}</b><span>${x.el>=1?"▲"+r0(x.el)+" m":x.el<=-1?"▼"+r0(-x.el)+" m":"flat"}${x.sg?" · "+x.sg+"🚦":""}</span></div>`).join("")}</div>`
   :`<div class="cues">${cues(rt).map(c=>`<div class="cue" data-act="cue" data-m="${c.m}"><span class="k">${c.m<0?"Before":"Km "+r1(c.m/1000)}</span><span>${esc(c.t)}</span></div>`).join("")}</div>`}
  <div class="legend" style="margin-top:6px">${[...new Set(zonesOf(rt).map(z=>z.z))].map(z=>`<span><i style="background:${ZC[z]};box-shadow:0 0 6px ${ZC[z]}"></i>${ZL[z]} ${fmtT(pz()[z])}/km</span>`).join("")}${rt.elev?"":`<span>· elevation unavailable</span>`}</div></div></div>`;
  const n2=$("#rname2");if(n2)n2.onchange=e=>{rt.name=e.target.value.trim().slice(0,60)||rt.name;if($("#rname"))$("#rname").value=rt.name;if(rt.saved)saveSel();else renderLeft()};
  const sv=$("#prof");if(sv){sv.onmousemove=e=>{const b=sv.getBoundingClientRect(),m=clamp((e.clientX-b.left-30*b.width/1000)/(b.width*(960/1000)),0,1)*rt.dist;profHover(m)};sv.onmouseleave=()=>profHover(null)}}
function renderCompare(el){const[a,b]=A.cmp.map(id=>A.options.find(o=>o.id===id));if(!a||!b){A.cmp=[];return false}
  const R=[["Score",o=>o.disp||0,1,v=>v],["Km",o=>o.dist/1000,0,v=>r1(v)],["Time",o=>estTime(o),-1,fmtT],["Difficulty",o=>difficulty(o).s,-1,v=>v],["Climb",o=>o.climb||0,-1,v=>v+" m"],["Signals",o=>o.signals||0,-1,v=>v],["Crossings",o=>o.cross||0,-1,v=>v],["Cafes",o=>cnt(o,"cafe"),1,v=>v],["Water/shops",o=>cnt(o,"water")+cnt(o,"shop"),1,v=>v],["Toilets",o=>cnt(o,"toilet"),1,v=>v],["Scenic",o=>r0((o.scenic||0)*100),1,v=>v+"%"]];
  const row=(o,j)=>`<button class="cmpn" data-act="opt" data-i="${A.options.indexOf(o)}"><i style="background:${o===A.sel?"#2E8BFF":"#B76CFF"}"></i><span>#${o.rank} ${esc(o.name)}</span></button>${R.map(([l,f,dir,fm])=>{const x=f(a),y=f(b),me=j?y:x,ot=j?x:y,win=dir&&me!==ot&&(dir>0?me>ot:me<ot);return`<b class="num ${win?"win":""}">${fm(me)}</b>`}).join("")}`;
  el.innerHTML=`<div class="cmph"><span class="ey">Compare · green = better</span><button class="btn sm" data-act="cmpclose">Close compare</button></div><div class="cmpg"><span></span>${R.map(r=>`<span class="ey">${r[0]}</span>`).join("")}${row(a,0)}${row(b,1)}</div>`;return true}
function profSvg(rt){const W=1000,H=118,pl=30,pb=16,E=rt.elev||[{m:0,e:0},{m:rt.dist,e:0}],lo=Math.min(...E.map(x=>x.e)),hi=Math.max(lo+12,...E.map(x=>x.e)),X=m=>pl+m/rt.dist*(W-pl-10),Y=e=>8+(1-(e-lo)/(hi-lo))*(H-pb-14);
  const line=E.map(x=>`${X(x.m).toFixed(1)},${Y(x.e).toFixed(1)}`).join(" ");const Z=zonesOf(rt);
  const grads=Z.map((z,i)=>`<clipPath id="zc${i}"><rect x="${X(z.a)}" y="0" width="${X(z.b)-X(z.a)}" height="${H}"/></clipPath>`).join("");
  const fills=Z.map((z,i)=>`<polygon clip-path="url(#zc${i})" points="${X(0)},${H-pb} ${line} ${X(rt.dist)},${H-pb}" fill="${ZC[z.z]}" fill-opacity=".22"/><polyline clip-path="url(#zc${i})" points="${line}" fill="none" stroke="${ZC[z.z]}" stroke-width="2.2"/>`).join("");
  const kms=[];for(let k=1;k*1000<rt.dist;k++)kms.push(`<line x1="${X(k*1000)}" x2="${X(k*1000)}" y1="${8}" y2="${H-pb}" stroke="rgba(255,255,255,.05)"/><text x="${X(k*1000)}" y="${H-3}" text-anchor="middle" class="ax">${k}</text>`);
  const br=(rt.bridges||[]).map(b=>`<text x="${X((b.a+b.b)/2)}" y="16" text-anchor="middle" fill="#FFB020" font-size="11" font-family="IBM Plex Mono">flyover</text>`).join("");
  const sg=(rt.pois||[]).filter(p=>p.t==="signal").map(p=>`<circle cx="${X(p.m)}" cy="${H-pb-3}" r="2.6" fill="#FF5C5F"/>`).join("");
  return`<svg id="prof" class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Elevation profile"><style>.ax{fill:#5C677A;font:10px "IBM Plex Mono"}</style><defs>${grads}</defs>${kms.join("")}<text x="${pl-6}" y="${Y(hi)+4}" text-anchor="end" class="ax">${r0(hi)}m</text><text x="${pl-6}" y="${Y(lo)}" text-anchor="end" class="ax">${r0(lo)}m</text>${fills}${br}${sg}<line id="phl" x1="0" x2="0" y1="8" y2="${H-pb}" stroke="#fff" stroke-opacity=".6" visibility="hidden"/></svg>`}
function profHover(m){const ln=$("#phl"),rt=A.sel;if(hoverMk){hoverMk.remove();hoverMk=null}if(m==null||!rt){ln&&ln.setAttribute("visibility","hidden");return}const x=30+m/rt.dist*960;ln.setAttribute("x1",x);ln.setAttribute("x2",x);ln.setAttribute("visibility","visible");
  hoverMk=L.marker(ptAt(rt.coords,rt.cum,m),{interactive:false,icon:L.divIcon({className:"",html:'<div class="hover-dot"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map).bindTooltip("km "+r1(m/1000),{permanent:true,className:"tt",direction:"top",offset:[0,-10]})}
function renderAll(){renderLeft();renderRight();renderBottom()}

/* ================= actions ================= */
function setMode(m,quiet){A.mode=m;A.options=[];if(m==="draw"){A.draw=A.start?[A.start]:[];A.drawClosed="";A.sel=null;clearRoute();drawRebuild()}else{L_draw.clearLayers();if(startMk)startMk.setOpacity(1);A.sel=null;clearRoute()}if(!quiet)renderAll()}
function locate(){if(!navigator.geolocation){toast("Location isn't available in this browser.",true);return}status("Finding you…");navigator.geolocation.getCurrentPosition(p=>{status("");const c=[p.coords.latitude,p.coords.longitude];map.setView(c,16);setStart(c,false);toast("Start set to your location.")},()=>{status("");toast("Location blocked. Click the map to set a start, or allow location for this site.",true)},{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  const H={mode:()=>setMode(t.dataset.v),locate,build,
    buildToday:()=>{const s=sess();if(!s)return;const rec=A.pace?.rec,low=rec!=null&&rec<34&&selDate()===todayISO();if(rType()==="session"){A.km=clamp(Math.round((low?s.km*.8:s.km)*2)/2,1,21);if(low)A.runType="easy"}if(A.mode==="draw")setMode("loop",true);if(painNow()>=3){A.prefs.flat=true;A.prefs.scenic=true}build()},
    pref:()=>{const k=t.dataset.k;A.prefs[k]=!A.prefs[k];LS.set("prefs",A.prefs);if(A.options.length){A.options.forEach(o=>o.sc=score(o,A.km*1000));A.options.sort((a,b)=>b.sc-a.sc)}renderLeft()},
    opt:()=>selectRoute(A.options[+t.dataset.i]),
    fav:()=>{if(e.target.closest(".x"))return;const f=A.favs[+t.dataset.i];map.setView(f.p,16);setStart(f.p,false);toast("Start: "+f.name)},
    favdel:()=>{e.stopPropagation();A.favs.splice(+t.dataset.i,1);LS.set("favs",A.favs);renderLeft()},
    favadd:()=>{openName("Name this start","Home, Marine Drive, school…","",nm=>{A.favs.push({name:nm,p:A.start});LS.set("favs",A.favs);renderLeft();toast("Saved start: "+nm)})},
    save:saveSel,open:()=>{if(e.target.closest(".del"))return;openSaved(t.dataset.id)},
    del:()=>{e.stopPropagation();const r=A.routes.find(x=>x.id===t.dataset.id);if(!r)return;if(!confirmDel(r))return;A.routes=A.routes.filter(x=>x.id!==r.id);LS.set("routes",A.routes);renderLeft();toast("Deleted "+r.name)},
    undo:()=>{A.draw.pop();A.drawClosed="";drawRebuild()},dclear:()=>{A.draw=A.start?[A.start]:[];A.drawClosed="";drawRebuild()},
    dloop:()=>{A.drawClosed=A.drawClosed==="loop"?"":"loop";drawRebuild()},dob:()=>{A.drawClosed=A.drawClosed==="ob"?"":"ob";drawRebuild()},
    day:()=>{A.day=+t.dataset.d;A.runType="auto";A.kmTouched=false;A.cmp=[];const b=bestSlot();A.hour=b?b.h:A.hour;renderAll();if(A.sel)drawRoute()},hour:()=>{A.hour=+t.dataset.h;renderAll()},
    poi:()=>{const k=t.dataset.k;A.poiOn[k]=A.poiOn[k]?0:1;LS.set("poiOn",A.poiOn);drawRoute();renderRight()},
    tab:()=>{A.tab=t.dataset.v;renderBottom()},
    rtype:()=>{const v=t.dataset.v,s=sess(),k=kipx();A.runType=v;if(v==="session"&&s)A.km=clamp(Math.round(s.km*2)/2,1,21);else if(!A.kmTouched)A.km=k&&k.type===v?k.km:{easy:5,steady:6,tempo:6,long:Math.max(7,Math.ceil((A.pace?.longest||6)+1))}[v];renderLeft();if(A.sel){drawRoute();renderBottom()}},
    sort:()=>{A.sort=t.dataset.v;renderLeft()},
    cmp:()=>{const o=A.options[+t.dataset.i];if(!o)return;const i=A.cmp.indexOf(o.id);if(i>=0)A.cmp.splice(i,1);else{A.cmp.push(o.id);if(A.cmp.length>2)A.cmp.shift()}if(A.cmp.length===2&&!A.cmp.includes(A.sel?.id)){A.sel=A.options.find(x=>x.id===A.cmp[0])}drawRoute();renderAll();if(A.cmp.length===2){const B=L.latLngBounds([...A.options.find(x=>x.id===A.cmp[0]).coords,...A.options.find(x=>x.id===A.cmp[1]).coords]);map.fitBounds(B,{paddingTopLeft:[360,80],paddingBottomRight:[340,230],maxZoom:16})}},
    cmpclose:()=>{A.cmp=[];drawRoute();renderAll()},colour:()=>{A.colour=t.dataset.v;drawRoute();renderBottom()},
    cue:()=>{const m=+t.dataset.m;if(m>=0&&A.sel){map.setView(ptAt(A.sel.coords,A.sel.cum,m),17);profHover(m);setTimeout(()=>profHover(null),2500)}},
    heat:()=>{A.heat=!A.heat;$("#heatBtn").classList.toggle("on",A.heat);drawHeat()},send:sendPace,
    copyagain:()=>{const t2=$("#codeBox");t2.select();navigator.clipboard?.writeText(t2.value).then(()=>toast("Copied"),()=>document.execCommand("copy"))},
    mclose:()=>$("#modal").innerHTML="","mclose-bg":()=>{if(e.target===t)$("#modal").innerHTML=""},
    nameok:()=>{const v=$("#nmIn").value.trim();if(!v)return;$("#modal").innerHTML="";nameCb&&nameCb(v.slice(0,40))}};
  if(H[a]){if(t.tagName==="A")return;H[a]()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").innerHTML="";if(e.key==="Enter"&&e.target.id==="nmIn")document.querySelector('[data-act="nameok"]').click();if(e.key==="Enter"&&e.target.classList.contains("lib"))e.target.click();if(e.key==="Enter"&&e.target.id==="rname")saveSel()});
function confirmDel(r){return window.confirm(`Delete “${r.name}”? Runs logged on it in PACE stay.`)}
let nameCb=null;function openName(title,ph,val,cb){nameCb=cb;$("#modal").innerHTML=`<div class="ov" data-act="mclose-bg"><div class="md" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><input class="inp" id="nmIn" placeholder="${esc(ph)}" value="${esc(val)}" style="margin:12px 0"><div class="ft"><button class="btn" data-act="mclose">Cancel</button><button class="btn p" data-act="nameok">Save</button></div></div></div>`;$("#nmIn").focus()}

/* search (Nominatim) */
let sT;$("#q").addEventListener("input",e=>{clearTimeout(sT);const v=e.target.value.trim();if(v.length<3){$("#sres").hidden=true;return}sT=setTimeout(()=>search(v),450)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(sT);search(e.target.value.trim())}if(e.key==="Escape")$("#sres").hidden=true});
async function search(v){if(!v)return;try{const c=map.getCenter(),j=await(await fetchT(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=in&q=${encodeURIComponent(v)}&viewbox=${c.lng-.4},${c.lat+.4},${c.lng+.4},${c.lat-.4}`,8000,{headers:{"Accept-Language":"en"}})).json();
  const box=$("#sres");box.hidden=false;box.innerHTML=j.length?j.map(r=>`<button data-lat="${r.lat}" data-lon="${r.lon}"><b>${esc(r.name||r.display_name.split(",")[0])}</b><br><span class="small muted">${esc(r.display_name.split(",").slice(1,4).join(","))}</span></button>`).join(""):`<button disabled><span class="muted">No places found</span></button>`;
  box.querySelectorAll("button[data-lat]").forEach(b=>b.onclick=()=>{const p=[+b.dataset.lat,+b.dataset.lon];box.hidden=true;$("#q").value="";map.setView(p,16);setStart(p,false);toast("Start set. Hit Build.")})}catch(e){toast("Search isn't responding right now.",true)}}

/* ================= boot ================= */
readHash();initMap();renderAll();if(A.focus&&A.routes.some(r=>r.id===A.focus))setTimeout(()=>openSaved(A.focus),300);
if(!A.start){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,16);setStart(c,false)},()=>{setStart(MUMBAI,false);toast("Using Marine Drive. Allow location or click the map to change the start.")},{timeout:8000,maximumAge:120000});else setStart(MUMBAI,false)}
else loadWx();
renderLeft();
</script></body></html>
